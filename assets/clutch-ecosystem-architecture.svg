<svg viewBox="0 0 1100 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CLUTCH top-down ecosystem architecture</title>
  <desc id="desc">A top-down diagram showing projects routed through CLUTCH into agent PCs, collab transport, local snapshots, backups, task alarms, away development, and local AI, robot, and sensor resources.</desc>
  <defs>
    <style>
      text { font-family: "Times New Roman", Times, serif; }
    </style>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <g id="local-setup">
      <rect x="-90" y="0" width="180" height="80" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="4 4"/>
      <g transform="translate(-50, 35)">
        <rect x="-12" y="-12" width="24" height="5" rx="1" fill="#111111"/>
        <rect x="-12" y="-4" width="24" height="5" rx="1" fill="#111111"/>
        <rect x="-12" y="4" width="24" height="5" rx="1" fill="#111111"/>
        <text x="0" y="26" font-size="10" font-weight="700" fill="#666666" text-anchor="middle">AI / GPU</text>
      </g>
      <g transform="translate(0, 35)">
        <path d="M -8 6 L 8 6 L 5 1 L -5 1 Z" fill="#111111"/>
        <rect x="-3" y="-14" width="6" height="15" rx="1" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
        <circle cx="0" cy="-14" r="3" fill="#111111"/>
        <path d="M -5 -22 C -5 -17, 5 -17, 5 -22" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
        <text x="0" y="26" font-size="10" font-weight="700" fill="#666666" text-anchor="middle">Robot</text>
      </g>
      <g transform="translate(50, 35)">
        <circle cx="0" cy="6" r="4" fill="#111111"/>
        <path d="M -8 -4 Q 0 -10 8 -4" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M -12 -10 Q 0 -20 12 -10" fill="none" stroke="#999999" stroke-width="1.5" stroke-linecap="round"/>
        <text x="0" y="26" font-size="10" font-weight="700" fill="#666666" text-anchor="middle">Sensors</text>
      </g>
    </g>
    <g id="laptop-node">
      <rect x="-45" y="-30" width="90" height="55" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <rect x="-39" y="-24" width="78" height="43" fill="#f8f8f8"/>
      <path d="M -55 25 L 55 25 L 60 33 L -60 33 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
      <line x1="-25" y1="29" x2="25" y2="29" stroke="#cccccc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-2" r="6" fill="#111111" opacity="0.8"/>
    </g>
    <g id="project-node">
      <rect x="-75" y="-25" width="150" height="50" rx="25" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#soft-shadow)"/>
      <circle cx="-50" cy="0" r="14" fill="#111111"/>
      <path d="M -54 -4 L -46 -4 M -54 0 L -46 0 M -54 4 L -50 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <path id="flow-p1-hub" d="M 250 145 C 250 250, 550 250, 550 360" fill="none"/>
    <path id="flow-p2-hub" d="M 550 145 L 550 360" fill="none"/>
    <path id="flow-hub-pc1" d="M 550 500 C 550 600, 250 580, 250 680" fill="none"/>
    <path id="flow-hub-pc2" d="M 550 500 C 550 600, 550 580, 550 680" fill="none"/>
    <path id="flow-hub-pc3" d="M 550 500 C 550 600, 850 580, 850 680" fill="none"/>
    <clipPath id="logo-clip">
      <circle cx="550" cy="410" r="72"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1100" height="950" rx="24" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 250 145 C 250 250, 550 250, 550 360" stroke="#cccccc" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 550 145 L 550 360" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 850 145 C 850 250, 550 250, 550 360" stroke="#cccccc" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 550 500 C 550 600, 250 580, 250 680" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 500 C 550 600, 550 580, 550 680" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 500 C 550 600, 850 580, 850 680" stroke="#000000" stroke-width="4" stroke-dasharray="8 8" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <line x1="250" y1="745" x2="250" y2="810" stroke="#999999" stroke-width="3" stroke-dasharray="4 4"/>
    <line x1="550" y1="745" x2="550" y2="810" stroke="#999999" stroke-width="3" stroke-dasharray="4 4"/>
    <line x1="850" y1="745" x2="850" y2="810" stroke="#999999" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M 280 370 L 460 430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 280 490 L 460 430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 820 370 L 640 430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 820 490 L 640 430" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <circle r="4" fill="#000000"><animateMotion dur="2.5s" repeatCount="indefinite"><mpath href="#flow-p1-hub"/></animateMotion></circle>
  <circle r="5" fill="#000000"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#flow-p2-hub"/></animateMotion></circle>
  <circle r="5" fill="#000000"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#flow-hub-pc1"/></animateMotion></circle>
  <circle r="5" fill="#000000"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#flow-hub-pc2"/></animateMotion></circle>
  <circle r="5" fill="#000000"><animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#flow-hub-pc3"/></animateMotion></circle>

  <g transform="translate(250, 120)">
    <use href="#project-node"/>
    <text x="10" y="5" font-weight="700" font-size="16" fill="#333333" text-anchor="middle">Project A</text>
    <rect x="-35" y="35" width="70" height="20" rx="10" fill="#f0f0f0" stroke="#cccccc"/>
    <text x="0" y="49" font-size="11" font-weight="700" fill="#888888" text-anchor="middle">Bound</text>
  </g>
  <g transform="translate(550, 120)">
    <use href="#project-node"/>
    <text x="10" y="5" font-weight="700" font-size="16" fill="#000000" text-anchor="middle">Project B</text>
    <rect x="-45" y="35" width="90" height="20" rx="10" fill="#111111"/>
    <circle cx="-32" cy="45" r="3" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
    <text x="4" y="49" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Session Entry</text>
  </g>
  <g transform="translate(850, 120)">
    <use href="#project-node"/>
    <text x="10" y="5" font-weight="700" font-size="16" fill="#333333" text-anchor="middle">Project C</text>
    <rect x="-35" y="35" width="70" height="20" rx="10" fill="#f0f0f0" stroke="#cccccc"/>
    <text x="0" y="49" font-size="11" font-weight="700" fill="#888888" text-anchor="middle">Unbound</text>
  </g>

  <g id="clutch-central-hub">
    <circle cx="550" cy="410" r="90" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0 550 410" to="360 550 410" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="410" r="75" fill="#ffffff" stroke="#eeeeee" stroke-width="1" filter="url(#glow-effect)"/>
    <image x="470" y="330" width="160" height="160" href="clutchmainimage.png" clip-path="url(#logo-clip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g transform="translate(260, 370)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="-12" y="-10" width="24" height="16" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M -6 -10 L -3 -16 L 3 -16 L 6 -10" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="-2" r="3" fill="#000000"/>
    <text x="0" y="48" font-weight="700" font-size="12" fill="#333333" text-anchor="middle">Local Snapshot</text>
  </g>
  <g transform="translate(840, 370)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M -10 -8 C -10 -14, 10 -14, 10 -8 C 10 -2, -10 -2, -10 -8 Z" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M -10 -8 L -10 8 C -10 14, 10 14, 10 8 L 10 -8" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M -10 0 C -10 6, 10 6, 10 0" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="0" y="48" font-weight="700" font-size="12" fill="#333333" text-anchor="middle">Project Backup</text>
  </g>
  <g transform="translate(260, 490)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="-10" y="-14" width="16" height="28" rx="3" fill="none" stroke="#000000" stroke-width="2"/>
    <line x1="-5" y1="10" x2="1" y2="10" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 -8 A 10 10 0 0 1 10 8" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M 14 -12 A 15 15 0 0 1 14 12" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="0" y="48" font-weight="700" font-size="12" fill="#333333" text-anchor="middle">Remote/Away Dev</text>
  </g>
  <g transform="translate(840, 490)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M -8 6 C -8 -10, 8 -10, 8 6 L 12 10 L -12 10 Z" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="14" r="2" fill="#000000"/>
    <path d="M -16 -4 Q -20 0 -16 4" fill="none" stroke="#000000" stroke-width="2"/>
    <path d="M 16 -4 Q 20 0 16 4" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="0" y="48" font-weight="700" font-size="12" fill="#333333" text-anchor="middle">Task Alarms</text>
  </g>

  <g id="collab-transport">
    <path id="collab-path-1" d="M 300 660 L 500 660" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <path id="collab-path-2" d="M 500 660 L 300 660" fill="none"/>
    <circle r="3" fill="#111111"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#collab-path-1"/></animateMotion></circle>
    <circle r="3" fill="#111111"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#collab-path-2"/></animateMotion></circle>
    <rect x="340" y="648" width="120" height="24" rx="12" fill="#ffffff" stroke="#111111" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <circle cx="355" cy="660" r="3" fill="#111111"><animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="405" y="664" font-weight="700" font-size="11" fill="#111111" text-anchor="middle">Collab Transport</text>
  </g>

  <g transform="translate(250, 680)" filter="url(#soft-shadow)">
    <use href="#laptop-node"/>
    <g transform="translate(0, -45)">
      <rect x="-48" y="0" width="46" height="18" rx="5" fill="#111111"/>
      <circle cx="-38" cy="9" r="2.5" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
      <text x="-18" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Proj B</text>
      <rect x="2" y="0" width="46" height="18" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
      <text x="25" y="13" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Proj A</text>
    </g>
    <text x="0" y="52" font-weight="700" font-size="14" fill="#111111" text-anchor="middle">Agent PC 1</text>
  </g>
  <g transform="translate(250, 810)"><use href="#local-setup"/></g>

  <g transform="translate(550, 680)" filter="url(#soft-shadow)">
    <use href="#laptop-node"/>
    <g transform="translate(0, -45)">
      <rect x="-30" y="0" width="60" height="18" rx="5" fill="#111111"/>
      <circle cx="-18" cy="9" r="3" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
      <text x="6" y="13" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Proj B</text>
    </g>
    <text x="0" y="52" font-weight="700" font-size="14" fill="#111111" text-anchor="middle">Agent PC 2</text>
  </g>
  <g transform="translate(550, 810)"><use href="#local-setup"/></g>

  <g transform="translate(850, 680)" filter="url(#soft-shadow)">
    <use href="#laptop-node"/>
    <g transform="translate(0, -45)">
      <rect x="-48" y="0" width="46" height="18" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
      <text x="-25" y="13" font-size="10" font-weight="700" fill="#111111" text-anchor="middle">Proj A</text>
      <rect x="2" y="0" width="46" height="18" rx="5" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5"/>
      <text x="25" y="13" font-size="10" font-weight="700" fill="#888888" text-anchor="middle">Proj C</text>
    </g>
    <text x="0" y="52" font-weight="700" font-size="14" fill="#111111" text-anchor="middle">Agent PC 3</text>
  </g>
  <g transform="translate(850, 810)"><use href="#local-setup"/></g>
</svg>
