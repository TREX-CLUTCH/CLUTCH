name: Feature request
description: Suggest a CLUTCH public feature or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        CLUTCH public features should work with user-owned machines, paths,
        remotes, and artifact stores. Avoid proposals that depend on a private
        lab topology or expose private infrastructure.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change in public, machine-neutral terms.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First-run setup
        - Web console
        - Multi-PC collab
        - Backup and snapshots
        - Away development
        - Release packaging
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety and privacy boundary
      options:
        - label: This request does not require shipping private credentials, endpoints, hardware profiles, runtime state, backups, snapshots, or project histories.
          required: true
