name: Deploy CLUTCH Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/**"
      - "docs/prompt-cookbook.md"
      - "docs/first-use-acceptance.md"
      - "docs/verification-matrix.md"
      - "docs/faq.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p .pages-build
          cp site/index.html .pages-build/index.html
          cp site/styles.css .pages-build/styles.css
          cp -R assets .pages-build/assets
          cp -R docs .pages-build/docs
          perl -0pi -e 's#\.\./assets/#assets/#g; s#\.\./docs/#docs/#g' .pages-build/index.html

      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
